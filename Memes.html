<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEME_RANKER | Luminaxe Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --p1-color: #ff4d4d;
            --p2-color: #00f2ff;
            --bg: #05010a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background: var(--bg); color: #fff; font-family: 'Space Grotesk', sans-serif; height: 100vh; overflow: hidden; }

        .arena { display: flex; flex-direction: column; height: 100vh; }

        /* Oyuncu Alanları */
        .player-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            transition: 0.3s;
        }

        .p1-side { background: rgba(255, 77, 77, 0.05); border-bottom: 1px solid rgba(255, 77, 77, 0.2); }
        .p2-side { background: rgba(0, 242, 255, 0.05); border-top: 1px solid rgba(0, 242, 255, 0.2); flex-direction: column-reverse; }

        /* Puan Butonları */
        .rank-container { display: flex; gap: 10px; margin: 15px 0; }
        .rank-btn {
            width: 50px; height: 50px;
            border: 2px solid;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron'; font-weight: bold;
            background: transparent; color: white;
            font-size: 1.2rem;
        }

        .p1-side .rank-btn { border-color: var(--p1-color); }
        .p2-side .rank-btn { border-color: var(--p2-color); }
        .rank-btn.selected { background: white; color: black; transform: scale(1.1); }

        /* Orta Panel */
        .meme-display {
            background: #000;
            padding: 20px;
            text-align: center;
            border-top: 2px solid #bc13fe;
            border-bottom: 2px solid #bc13fe;
            min-height: 120px;
            display: flex; align-items: center; justify-content: center;
        }

        .meme-title { font-size: 1.2rem; font-weight: bold; color: #fff; text-transform: uppercase; }

        .label { font-family: 'Orbitron'; font-size: 0.8rem; opacity: 0.6; letter-spacing: 2px; }
        
        #result-screen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #000; z-index: 100; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .action-btn {
            margin-top: 20px; padding: 15px 30px;
            background: #bc13fe; color: white; border: none;
            border-radius: 5px; font-family: 'Orbitron';
        }
    </style>
</head>
<body>

    <div id="result-screen">
        <h1 id="winner-text" style="font-family: 'Orbitron'; font-size: 3rem;">SYNC COMPLETE</h1>
        <p id="stats" style="margin: 20px 0; font-family: monospace;"></p>
        <button class="action-btn" onclick="location.reload()">RE-BOOT ARENA</button>
    </div>

    <div class="arena">
        <div class="player-side p1-side" id="p1-area">
            <div class="label" style="color: var(--p1-color)">PLAYER_01 // VIBE_CHECK</div>
            <div class="rank-container" id="p1-ranks">
                <button class="rank-btn" onclick="vote('p1', 1)">1</button>
                <button class="rank-btn" onclick="vote('p1', 2)">2</button>
                <button class="rank-btn" onclick="vote('p1', 3)">3</button>
                <button class="rank-btn" onclick="vote('p1', 4)">4</button>
                <button class="rank-btn" onclick="vote('p1', 5)">5</button>
            </div>
            <div id="p1-status" style="font-size: 0.7rem; opacity: 0.5;">BEKLENİYOR...</div>
        </div>

        <div class="meme-display">
            <div id="meme-content" class="meme-title">OYUNU BAŞLATMAK İÇİN BİR PUAN VERİN</div>
        </div>

        <div class="player-side p2-side" id="p2-area">
            <div class="label" style="color: var(--p2-color)">PLAYER_02 // VIBE_CHECK</div>
            <div class="rank-container" id="p2-ranks">
                <button class="rank-btn" onclick="vote('p2', 1)">1</button>
                <button class="rank-btn" onclick="vote('p2', 2)">2</button>
                <button class="rank-btn" onclick="vote('p2', 3)">3</button>
                <button class="rank-btn" onclick="vote('p2', 4)">4</button>
                <button class="rank-btn" onclick="vote('p2', 5)">5</button>
            </div>
            <div id="p2-status" style="font-size: 0.7rem; opacity: 0.5;">BEKLENİYOR...</div>
        </div>
    </div>

    <script>
        const memeList = [
            "Pazartesi sabahı alarmın çalması",
            "Sınavda bildiğin soruyu unutmak",
            "Kasiyerle yanlışlıkla el ele tutuşmak",
            "Akraba grubuna atılan yanlış mesaj",
            "Diyetin 2. saatinde gelen acıkma hissi",
            "Eski sevgilinin fotoğrafını stalklarken beğenmek",
            "Yürürken boşluğa basıp düşer gibi olmak",
            "Okunmamış 500 WhatsApp mesajı",
            "Kendi sesini ses kaydında dinlemek",
            "Parmağını kapıya sıkıştırmak"
        ];

        let currentRound = 0;
        let p1Vote = null;
        let p2Vote = null;
        let totalDiff = 0; // Oyuncuların zevk farkı

        function vote(player, score) {
            if (player === 'p1') {
                p1Vote = score;
                highlight('p1', score);
                document.getElementById('p1-status').textContent = "PUAN VERİLDİ!";
            } else {
                p2Vote = score;
                highlight('p2', score);
                document.getElementById('p2-status').textContent = "PUAN VERİLDİ!";
            }

            if (p1Vote !== null && p2Vote !== null) {
                processRound();
            }
        }

        function highlight(player, score) {
            const btns = document.querySelectorAll(`#${player}-ranks .rank-btn`);
            btns.forEach(b => b.classList.remove('selected'));
            btns[score-1].classList.add('selected');
        }

        function processRound() {
            totalDiff += Math.abs(p1Vote - p2Vote);
            currentRound++;

            if (currentRound < memeList.length) {
                setTimeout(() => {
                    p1Vote = null;
                    p2Vote = null;
                    document.getElementById('p1-status').textContent = "BEKLENİYOR...";
                    document.getElementById('p2-status').textContent = "BEKLENİYOR...";
                    document.querySelectorAll('.rank-btn').forEach(b => b.classList.remove('selected'));
                    document.getElementById('meme-content').textContent = memeList[currentRound];
                }, 1000);
            } else {
                showFinal();
            }
        }

        function showFinal() {
            document.getElementById('result-screen').style.display = 'flex';
            const compatibility = Math.max(0, 100 - (totalDiff * 2));
            document.getElementById('stats').innerHTML = `
                ZEVK UYUMU: %${compatibility}<br>
                TOPLAM FARK PUANI: ${totalDiff}
            `;
            
            const winner = document.getElementById('winner-text');
            if (compatibility > 80) winner.textContent = "RUH ÖKÜZÜSÜNÜZ";
            else if (compatibility > 50) winner.textContent = "ORTA ŞEKERLİ";
            else winner.textContent = "AYRI DÜNYALAR";
        }

        // İlk meme
        document.getElementById('meme-content').textContent = memeList[0];
    </script>
</body>
</html>
